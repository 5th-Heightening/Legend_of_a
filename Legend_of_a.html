<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASCII Game</title>

    <style>
        body {
            background: #111;
            color: #eee;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: monospace;
        }

        #viewport {
            width: 41ch;
            height: 18em;

            margin: 0;
            padding: 0;

            font-family: monospace;
            font-size: 20px;
            line-height: 1;

            white-space: pre;
            overflow: hidden;

            background: #000;
            color: #fff;

            user-select: none;
        }
    </style>
</head>

<body>

<pre id="viewport"></pre>

<script src="SplashScreen.js"></script>

<script>

    // ==================================================
    // ASCII Renderer
    // ==================================================

    class AsciiRenderer {

        constructor(element, width = 36, height = 18) {
            this.element = element;

            this.width = width;
            this.height = height;

            this.objects = [];
        }


        // ==================================================
        // Object management
        // ==================================================

        add(object) {
            this.objects.push(object);
    
            return object;
        }


        remove(object) {
            const index = this.objects.indexOf(object);

            if (index !== -1) {
                this.objects.splice(index, 1);
            }
        }


        // ==================================================
        // Rendering
        // ==================================================

        render() {
    
            const buffer = Array.from(
                { length: this.height },
                () => Array(this.width).fill(" ")
            );


            const objects = [...this.objects]
                .sort((a, b) => a.z - b.z);


            for (const object of objects) {
                this.renderObject(buffer, object);
            }


            this.element.textContent = buffer
                .map(row => row.join(""))
                .join("\n");
        }


        renderObject(buffer, object) {

            const ascii = object.getAscii();

            const transparentChar =
                object.transparentChar ?? " ";
    
            const lines = ascii.split("\n");


            for (let dy = 0; dy < lines.length; dy++) {

                const line = lines[dy];


                for (let dx = 0; dx < line.length; dx++) {

                    const x = object.x + dx;
                    const y = object.y + dy;

    
                    if (
                        x < 0 ||
                        x >= this.width ||
                        y < 0 ||
                        y >= this.height
                    ) {
                        continue;
                    }


                    const character = line[dx];


                    if (character === transparentChar) {
                        continue;
                    }


                    buffer[y][x] = character;
                }
            }
        }


        // ==================================================
        // Collision Detection
        // ==================================================

        detectCollisions() {
    
            for (let i = 0; i < this.objects.length; i++) {
    
                const objectA = this.objects[i];


                for (
                    let j = i + 1;
                    j < this.objects.length;
                    j++
                ) {

                    const objectB = this.objects[j];


                    if (this.objectsCollide(objectA, objectB)) {

                        this.notifyCollision(
                            objectA,
                            objectB
                        );
                    }
                }
            }
        }


        objectsCollide(a, b) {

            const shapeA = this.getCollisionShape(a);
            const shapeB = this.getCollisionShape(b);

            const transparentA =
                a.transparentChar ?? " ";

            const transparentB =
                b.transparentChar ?? " ";


            const linesA = shapeA.split("\n");
            const linesB = shapeB.split("\n");


            // --------------------------------------------------
            // Bounding box
            // --------------------------------------------------

            const left = Math.max(
                a.x,
                b.x
            );

            const right = Math.min(
                a.x + this.getAsciiWidth(linesA),
                b.x + this.getAsciiWidth(linesB)
            );

            const top = Math.max(
                a.y,
                b.y
            );

            const bottom = Math.min(
                a.y + linesA.length,
                b.y + linesB.length
            );


            // No bounding-box overlap.
            if (
                left >= right ||
                top >= bottom
            ) {
                return false;
            }


            // --------------------------------------------------
            // Pixel/character collision
            // --------------------------------------------------

                for (let y = top; y < bottom; y++) {

                    for (let x = left; x < right; x++) {

                        const ax = x - a.x;
                        const ay = y - a.y;

                        const bx = x - b.x;
                        const by = y - b.y;


                        const charA =
                            linesA[ay]?.[ax] ?? transparentA;

                        const charB =
                            linesB[by]?.[bx] ?? transparentB;


                        // Both collision shapes occupy
                        // this character position.
                        if (
                            charA !== transparentA &&
                            charB !== transparentB
                        ) {
                            return true;
                        }
                    }
        }
        

        return false;
    }


    /**
     * Get the collision shape of an object.
     *
     * If the object provides getCollisionMap(),
     * use that.
     *
     * Otherwise its visible ASCII representation
     * is automatically used as its collision shape.
     */
    getCollisionShape(object) {

        if (
            typeof object.getCollisionMap === "function"
        ) {
            return object.getCollisionMap();
        }


        // Default:
        // visible ASCII == collision shape
        return object.getAscii();
    }


    getAsciiWidth(lines) {

        return Math.max(
            0,
            ...lines.map(line => line.length)
        );
    }


    // ==================================================
    // Collision callbacks
    // ==================================================

    notifyCollision(a, b) {

        if (
            typeof a.onCollision === "function"
        ) {
            a.onCollision(b);
        }


        if (
            typeof b.onCollision === "function"
        ) {
            b.onCollision(a);
        }
    }
}


    // ==================================================
    // Parallax scenery
    //
    // An environment piece doesn't have a fixed position.
    // Instead, it has 4 predefined positions - one for
    // each corner the player can stand in - and its actual
    // position is linearly interpolated between them based
    // on where the player currently is. Pieces with a wider
    // spread of corner positions appear to move more,
    // giving a pseudo-3D parallax effect.
    // ==================================================

    class ParallaxObject {

        constructor(corners, z) {
            this.corners = corners;
            this.z = z;

            this.x = corners.topLeft.x;
            this.y = corners.topLeft.y;
        }


        static lerp(a, b, t) {
            return a + (b - a) * t;
        }


        // t: player's horizontal position, 0 (left) .. 1 (right)
        // u: player's vertical position, 0 (top) .. 1 (bottom)
        //
        // Pure - returns where this object would be, without
        // moving it. Used both to actually move the object and
        // to predict its position for a collision check before
        // a move is committed.
        interpolatePosition(t, u) {

            const { topLeft, topRight, bottomLeft, bottomRight } =
                this.corners;

            const topX = ParallaxObject.lerp(topLeft.x, topRight.x, t);
            const topY = ParallaxObject.lerp(topLeft.y, topRight.y, t);

            const bottomX =
                ParallaxObject.lerp(bottomLeft.x, bottomRight.x, t);
            const bottomY =
                ParallaxObject.lerp(bottomLeft.y, bottomRight.y, t);

            return {
                x: Math.round(ParallaxObject.lerp(topX, bottomX, u)),
                y: Math.round(ParallaxObject.lerp(topY, bottomY, u))
            };
        }


        updatePosition(t, u) {
            const { x, y } = this.interpolatePosition(t, u);

            this.x = x;
            this.y = y;
        }


        // Default collision shape: the whole visible shape blocks
        // movement. Override in a subclass for a smaller footprint
        // (e.g. only a tree's trunk, not its canopy).
        getCollisionMap() {
            return this.getAscii();
        }
    }


    // ==================================================
    // Example Game Objects
    // ==================================================

    class Tree extends ParallaxObject {

        constructor(corners) {
            super(corners, 10);
        }


        getAscii() {
            return `
 /\\
/##\\
 ||
 || `;
        }
    }


    class Mountain extends ParallaxObject {

        constructor(corners) {
            super(corners, 1);
        }


        getAscii() {
            return `
  /\\
 /  \\
/____\\`;
        }
    }


    class Player {

        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.z = 20;

            // Last horizontal direction faced, kept even while
            // moving vertically or standing still.
            this.facing = "right";
        }


        getAscii() {
            return "A";
        }


        move(dx, dy) {
            this.x += dx;
            this.y += dy;
        }
    }


    // One-shot sword swing, one tile in front of the player. Starts
    // as "/", switches to "_" partway through, then removes itself.
    class Sword {

        constructor(player) {
            this.z = 25;

            const offset = player.facing === "left" ? -1 : 1;

            this.x = player.x + offset;
            this.y = player.y;

            this.char = ((offset == 1) ? "/" : "\\");
        }


        getAscii() {
            return this.char;
        }
    }


    // Shield held out in front of the player, in whichever
    // direction it's currently facing. Stays glued to the player
    // via getters, since it's shown for as long as a key is held
    // rather than for a fixed duration.
    class Shield {

        constructor(player) {
            this.player = player;
            this.z = 25;
        }


        get x() {
            const offset = this.player.facing === "left" ? -1 : 1;
            return this.player.x + offset;
        }


        get y() {
            return this.player.y;
        }


        getAscii() {
            return this.player.facing === "left" ? "[" : "]";
        }
    }


    class Ground {

        constructor() {
            this.x = 0;
            this.y = 0;
            this.z = 0;

            this.transparentChar = ".";
        }


        getAscii() {
            const row = ".".repeat(41);

            return "\n" + Array(18).fill(row).join("\n");
        }
    }


    // Walks back and forth along a fixed row between minX and
    // maxX, reversing direction at either end. Movement isn't
    // driven by player input - see the patrol timer in the game
    // section.
    class Enemy {

        constructor(x, y, minX, maxX) {
            this.x = x;
            this.y = y;
            this.z = 15;

            this.minX = minX;
            this.maxX = maxX;

            this.direction = 1;
        }


        getAscii() {
            return "E";
        }


        step() {
            this.x += this.direction;

            if (this.x >= this.maxX) {
                this.x = this.maxX;
                this.direction = -1;
            }
            else if (this.x <= this.minX) {
                this.x = this.minX;
                this.direction = 1;
            }
        }
    }

    // ==================================================
    // Game
    // ==================================================

    const viewport = document.getElementById("viewport");

    const renderer = new AsciiRenderer(
        viewport,
        41,
        18
    );


    // ==================================================
    // Title screen
    // ==================================================

    class BlinkingText {

        constructor(x, y, text) {
            this.x = x;
            this.y = y;
            this.z = 1;

            this.text = text;
            this.visible = true;

            this.transparentChar = " ";
        }


        getAscii() {
            return this.visible ? this.text : "";
        }
    }


    const splash = new SplashScreen();
    splash.x = 0;
    splash.y = 4;

    const pressAnyKey = new BlinkingText(14, 15, "Press any key");


    renderer.add(splash);
    renderer.add(pressAnyKey);

    renderer.render();


    const blinkTimer = setInterval(() => {
        pressAnyKey.visible = !pressAnyKey.visible;
        renderer.render();
    }, 500);


    // ==================================================
    // Game objects
    // ==================================================

    const ground = new Ground();
    const player = new Player(15, 10);

    const enemy = new Enemy(5, 12, 5, 35);
    const ENEMY_STEP_INTERVAL = 400;

    const tree = new Tree({
        topLeft: { x: 3, y: 3 },
        topRight: { x: 30, y: 3 },
        bottomLeft: { x: 6, y: 5 },
        bottomRight: { x: 33, y: 5 }
    });

    const mountain = new Mountain({
        topLeft: { x: 12, y: 0 },
        topRight: { x: 20, y: 0 },
        bottomLeft: { x: 10, y: 1 },
        bottomRight: { x: 22, y: 1 }
    });

    const parallaxObjects = [mountain, tree];


    // Player movement is clamped to the viewport, since the
    // parallax positions are interpolated from where the
    // player is between its 4 corners.
    const PLAYER_MIN_X = 0;
    const PLAYER_MAX_X = renderer.width - 1;
    const PLAYER_MIN_Y = 0;
    const PLAYER_MAX_Y = renderer.height - 1;


    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }


    // Normalized (0..1) position of a player coordinate between
    // its min/max bounds - what the parallax interpolation and
    // the collision prediction below are both driven by.
    function parallaxCoordsFor(x, y) {
        return {
            t: (x - PLAYER_MIN_X) / (PLAYER_MAX_X - PLAYER_MIN_X),
            u: (y - PLAYER_MIN_Y) / (PLAYER_MAX_Y - PLAYER_MIN_Y)
        };
    }


    function updateParallax() {

        const { t, u } = parallaxCoordsFor(player.x, player.y);

        for (const object of parallaxObjects) {
            object.updatePosition(t, u);
        }
    }


    // Wraps a game object as a plain {x, y, getAscii, ...} probe
    // pinned to a specific position, so renderer.objectsCollide()
    // can be reused to test a *hypothetical* position without
    // actually moving the real object.
    function makeCollisionProbe(source, x, y) {

        const probe = {
            x,
            y,
            transparentChar: source.transparentChar,
            getAscii: () => source.getAscii()
        };

        if (typeof source.getCollisionMap === "function") {
            probe.getCollisionMap = () => source.getCollisionMap();
        }

        return probe;
    }


    // Would the player collide with any environment part if it
    // stood at (px, py)? Each part's own position is predicted
    // for that same candidate spot, since the environment shifts
    // with the player (parallax).
    function wouldCollideAt(px, py) {

        const { t, u } = parallaxCoordsFor(px, py);

        const playerProbe = makeCollisionProbe(player, px, py);

        for (const object of parallaxObjects) {

            const { x, y } = object.interpolatePosition(t, u);

            const objectProbe = makeCollisionProbe(object, x, y);

            if (renderer.objectsCollide(playerProbe, objectProbe)) {
                return true;
            }
        }

        return false;
    }


    function startGame() {

        clearInterval(blinkTimer);

        renderer.remove(splash);
        renderer.remove(pressAnyKey);

        renderer.add(ground);
        renderer.add(mountain);
        renderer.add(tree);
        renderer.add(enemy);
        renderer.add(player);

        updateParallax();
        renderer.render();

        setInterval(() => {
            enemy.step();
            renderer.render();
        }, ENEMY_STEP_INTERVAL);
    }


    // ==================================================
    // Combat: sword swing (W, one-shot) and shield (A, held)
    // ==================================================

    const SWORD_FRAME_DURATION = 120;

    let sword = null;

    function swingSword() {

        // A swing already in progress isn't interrupted or restarted.
        if (sword) {
            return;
        }

        sword = new Sword(player);
        renderer.add(sword);
        renderer.render();

        setTimeout(() => {
            sword.char = "_";
            renderer.render();

            setTimeout(() => {
                renderer.remove(sword);
                sword = null;
                renderer.render();
            }, SWORD_FRAME_DURATION);

        }, SWORD_FRAME_DURATION);
    }


    let shield = null;

    function showShield() {

        if (shield) {
            return;
        }

        shield = new Shield(player);
        renderer.add(shield);
        renderer.render();
    }


    function hideShield() {

        if (!shield) {
            return;
        }

        renderer.remove(shield);
        shield = null;
        renderer.render();
    }


    // ==================================================
    // Input: title screen -> game, then move the player
    // ==================================================

    let gameStarted = false;

    document.addEventListener("keydown", event => {

        if (!gameStarted) {
            gameStarted = true;
            startGame();
            return;
        }

        const key = event.key.toLowerCase();

        if (key === "w") {

            // Ignore auto-repeat while the key is held - one press,
            // one swing.
            if (!event.repeat) {
                swingSword();
            }

            return;
        }

        if (key === "a") {
            showShield();
            return;
        }

        let dx = 0;
        let dy = 0;

        switch (event.key) {

            case "ArrowUp":
                dy = -1;
                break;

            case "ArrowDown":
                dy = 1;
                break;

            case "ArrowLeft":
                dx = -1;
                player.facing = "left";
                break;

            case "ArrowRight":
                dx = 1;
                player.facing = "right";
                break;

            default:
                return;
        }

        const targetX = clamp(player.x + dx, PLAYER_MIN_X, PLAYER_MAX_X);
        const targetY = clamp(player.y + dy, PLAYER_MIN_Y, PLAYER_MAX_Y);

        if (!wouldCollideAt(targetX, targetY)) {
            player.x = targetX;
            player.y = targetY;
        }

        updateParallax();
        renderer.render();
    });


    document.addEventListener("keyup", event => {

        if (event.key.toLowerCase() === "a") {
            hideShield();
        }
    });

</script>

</body>
</html>

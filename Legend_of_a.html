<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASCII Game</title>

    <style>
        :root {
            --bg: #111;
            --fg: #eee;
            --viewport-bg: #000;
            --viewport-fg: #fff;
        }

        :root.light-mode {
            --bg: #fff;
            --fg: #111;
            --viewport-bg: #fff;
            --viewport-fg: #000;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: monospace;
        }

        #viewport {
            /* play area (52 x 18) + 1-cell border on each side */
            width: 54ch;
            height: 24em;

            margin: 0;
            padding: 0;

            font-family: monospace;
            font-size: 20px;
            line-height: 1;

            white-space: pre;
            overflow: hidden;

            background: var(--viewport-bg);
            color: var(--viewport-fg);

            user-select: none;
        }

        #theme-toggle {
            position: fixed;
            top: 12px;
            right: 12px;

            font-family: monospace;
            font-size: 14px;

            padding: 4px 10px;

            background: var(--viewport-bg);
            color: var(--viewport-fg);
            border: 1px solid var(--viewport-fg);

            cursor: pointer;
        }
    </style>
</head>

<body>

<button id="theme-toggle" type="button">Light Mode</button>

<pre id="viewport"></pre>

<script src="theme.js"></script>

<script src="AsciiRenderer.js"></script>
<script src="GameLoop.js"></script>
<script src="World.js"></script>
<script src="ParallaxObject.js"></script>
<script src="Tree.js"></script>
<script src="Mountain.js"></script>
<script src="Mover.js"></script>
<script src="MovingObject.js"></script>
<script src="MovementSystem.js"></script>
<script src="RubberBand.js"></script>
<script src="Player.js"></script>
<script src="PlayerController.js"></script>
<script src="Stance.js"></script>
<script src="Clash.js"></script>
<script src="Bracing.js"></script>
<script src="SwordWindup.js"></script>
<script src="EnemyTactics.js"></script>
<script src="Ground.js"></script>
<script src="Enemy.js"></script>
<script src="Particle.js"></script>
<script src="DeathJump.js"></script>
<script src="Squiggle.js"></script>
<script src="BlinkingText.js"></script>
<script src="SplashScreen.js"></script>

<script src="game.js"></script>

</body>
</html>
